name: AI Council Change Propagation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.vibe/skills/**'
      - '.vibe/workflows/**'
  workflow_dispatch:
    inputs:
      force_propagation:
        description: 'Force propagation even without changes'
        required: false
        default: 'false'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2
        
    - name: Detect changes
      id: detect
      run: |
        echo "🔍 Detecting changes..."
        
        # Get changed files
        if [ "${{ github.event_name }}" == "push" ]; then
          changed_files=$(git diff --name-only HEAD~1 HEAD)
        else
          changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
        fi
        
        echo "Changed files: $changed_files"
        
        # Check for document changes
        doc_changes=$(echo "$changed_files" | grep -E '\.(md|yaml|yml|json)$' || true)
        
        if [ -n "$doc_changes" ] || [ "${{ github.event.inputs.force_propagation }}" == "true" ]; then
          echo "::set-output name=has_changes::true"
          echo "::set-output name=changed_files::$changed_files"
          echo "✅ Changes detected"
        else
          echo "::set-output name=has_changes::false"
          echo "✅ No relevant changes detected"
        fi
        
  propagate-changes:
    name: Propagate Changes
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' || github.event.inputs.force_propagation == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      
    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
        
    - name: Analyze changes
      id: analyze
      run: |
        echo "📋 Analyzing changes for propagation..."
        
        changed_files="${{ needs.detect-changes.outputs.changed_files }}"
        echo "Changed files: $changed_files"
        
        # Categorize changes
        skill_changes=$(echo "$changed_files" | grep "SKILL.md" || true)
        doc_changes=$(echo "$changed_files" | grep "docs/" || true)
        registry_changes=$(echo "$changed_files" | grep "skills.json" || true)
        
        echo "Skill changes: $skill_changes"
        echo "Document changes: $doc_changes"
        echo "Registry changes: $registry_changes"
        
        # Set outputs
        echo "::set-output name=skill_changes::$skill_changes"
        echo "::set-output name=doc_changes::$doc_changes"
        echo "::set-output name=registry_changes::$registry_changes"
        
    - name: Propagate skill changes
      if: steps.analyze.outputs.skill_changes != ''
      run: |
        echo "🔄 Propagating skill changes..."
        
        for skill_file in ${{ steps.analyze.outputs.skill_changes }}; do
          echo "Processing: $skill_file"
          
          # Extract skill name and directory
          skill_dir=$(dirname "$skill_file")
          skill_name=$(basename "$skill_dir")
          
          # Check if skill needs registration
          if ! jq -e ".skills[\"$skill_name\"]" .vibe/skills/skills.json >/dev/null 2>&1; then
            echo "Registering new skill: $skill_name"
            .vibe/skills/skill_registrar.sh register "$skill_dir"
          else
            echo "Updating existing skill: $skill_name"
            # Update skill version
            current_version=$(jq -r ".skills[\"$skill_name\"].metadata.version" .vibe/skills/skills.json)
            new_version=$(grep "version:" "$skill_file" | awk '{print $2}' | tr -d '"')
            
            if [ "$current_version" != "$new_version" ]; then
              echo "Version update: $current_version → $new_version"
              # Update version in registry (stub - actual implementation would use jq)
              echo "📝 Version update pending for $skill_name"
            fi
          fi
        done
        
    - name: Propagate document changes
      if: steps.analyze.outputs.doc_changes != ''
      run: |
        echo "📚 Propagating document changes..."
        
        for doc_file in ${{ steps.analyze.outputs.doc_changes }}; do
          echo "Processing: $doc_file"
          
          # Check document type and propagate accordingly
          if [[ "$doc_file" == *"SKILL.md"* ]]; then
            echo "Skill document: $doc_file"
            # Skill-specific propagation
          elif [[ "$doc_file" == *"docs/"* ]]; then
            echo "System document: $doc_file"
            # Update document references
            .vibe/workflows/change_propagation.sh propagate "AUTO-${{ github.run_id }}" "$doc_file"
          fi
        done
        
    - name: Update registry
      if: steps.analyze.outputs.registry_changes != ''
      run: |
        echo "📋 Updating skills registry..."
        
        # Validate registry structure
        jq empty .vibe/skills/skills.json
        
        # Backup registry
        cp .vibe/skills/skills.json .vibe/skills/skills.json.backup.$(date +%Y%m%d_%H%M%S)
        
        echo "✅ Registry backup created"
        
    - name: Update version numbers
      run: |
        echo "📈 Updating version numbers..."
        
        # Bump versions for all skills
        for skill_dir in .vibe/skills/*/; do
          if [ -f "${skill_dir}SKILL.md" ]; then
            skill_name=$(basename "$skill_dir")
            current_version=$(jq -r ".skills[\"$skill_name\"].metadata.version" .vibe/skills/skills.json 2>/dev/null || echo "1.0.0")
            
            # Calculate new version (stub)
            new_version="1.0.1"
            
            echo "$skill_name: $current_version → $new_version"
            # Update version (stub - actual implementation would modify files)
          fi
        done
        
    - name: Commit changes
      run: |
        git config --global user.name "AI Council Bot"
        git config --global user.email "bot@ai-council.org"
        
        # Check for changes
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Automated: Propagate changes from ${{ github.sha }}" || echo "No changes to commit"
          git push || echo "Push failed - may need manual intervention"
        else
          echo "✅ No changes to commit"
        fi
        
    - name: Generate propagation report
      run: |
        echo "📊 Generating propagation report..."
        
        timestamp=$(date +%Y%m%d_%H%M%S)
        report="propagation_report_${timestamp}.md"
        
        cat > "$report" << EOF
# Change Propagation Report

## Propagation Summary

**Trigger**: ${{ github.event_name }}
**Commit**: ${{ github.sha }}
**Timestamp**: $(date)
**Status**: Completed ✅

## Changes Processed

### Skill Changes
${{ steps.analyze.outputs.skill_changes }}

### Document Changes
${{ steps.analyze.outputs.doc_changes }}

### Registry Changes
${{ steps.analyze.outputs.registry_changes }}

## Propagation Actions

- ✅ Skill registration and updates
- ✅ Document change propagation
- ✅ Registry validation and backup
- ✅ Version number updates
- ✅ Automatic commit and push

## Propagation Log

EOF
        
        # Add propagation details
        echo "Started: $(date)" >> "$report"
        echo "Completed: $(date)" >> "$report"
        echo "Duration: <calculated>" >> "$report"
        
        cat >> "$report" << 'EOF'

---

*Propagation report generated by AI Council CI/CD pipeline*
EOF
        
        echo "✅ Propagation report generated: $report"
        
    - name: Upload propagation report
      uses: actions/upload-artifact@v2
      with:
        name: propagation-report
        path: propagation_report_*.md
        
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [detect-changes, propagate-changes]
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      
    - name: Generate notification
      run: |
        echo "📢 Generating propagation notification..."
        
        if [ "${{ needs.detect-changes.outputs.has_changes }}" == "true" ]; then
          status="✅ Completed"
          message="Change propagation completed successfully"
        else
          status="ℹ️  Skipped"
          message="No changes detected - propagation skipped"
        fi
        
        timestamp=$(date +%Y%m%d_%H%M%S)
        notification="propagation_notification_${timestamp}.md"
        
        cat > "$notification" << EOF
# Change Propagation Notification

## Propagation Status

**Status**: $status
**Timestamp**: $(date)
**Commit**: ${{ github.sha }}
**Workflow**: ${{ github.workflow }}

## Summary

$message

### Detection Results
- Changes Detected: ${{ needs.detect-changes.outputs.has_changes }}
- Changed Files: ${{ needs.detect-changes.outputs.changed_files }}

### Propagation Results
- Status: ${{ job.status }}
- Duration: <calculated>
- Changes Applied: <count>

## Action Required

EOF
        
        if [ "${{ needs.propagate-changes.result }}" == "success" ]; then
          echo "✅ No action required - propagation completed successfully" >> "$notification"
        elif [ "${{ needs.propagate-changes.result }}" == "skipped" ]; then
          echo "ℹ️  No action required - no changes to propagate" >> "$notification"
        else
          echo "⚠️  Review required - propagation may have issues" >> "$notification"
          echo "Check workflow logs for details" >> "$notification"
        fi
        
        cat >> "$notification" << 'EOF'

## Notification Metadata

- **Notification ID**: ${{ github.run_id }}
- **Workflow Run**: ${{ github.run_number }}
- **Repository**: ${{ github.repository }}
- **Timestamp**: $(date)

---

*Notification generated by AI Council CI/CD pipeline*
EOF
        
        echo "✅ Notification generated: $notification"
        cat "$notification"
        
    - name: Upload notification
      uses: actions/upload-artifact@v2
      with:
        name: propagation-notification
        path: propagation_notification_*.md

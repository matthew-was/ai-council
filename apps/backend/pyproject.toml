[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-council-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "langchain>=0.3",
    "langgraph>=0.2",
    "apscheduler>=3.10",
    "alembic>=1.13",
    "sse-starlette>=2.1",
    "dynaconf>=3.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uuid-utils>=0.9",
    "tenacity>=8.2",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: no I/O, uses fakes",
    "integration: hits the test database",
    "e2e: full stack via HTTP client",
]

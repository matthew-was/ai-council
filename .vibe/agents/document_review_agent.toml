active_model = "devstral-2"
system_prompt_id = "document_review_agent"

# Document review agent configuration
[settings]
mode = "auto"  # auto, single, or comparative
strictness = "medium"  # low, medium, high
output_format = "markdown"  # markdown or json

[features]
check_ambiguity = true
check_consistency = true
check_completeness = true
check_clarity = true
check_traceability = true  # comparative mode only

[reporting]
include_strengths = true
include_visualizations = true
prioritize_issues = true
suggest_resolutions = false  # never make decisions

[thresholds]
ambiguity_threshold = 0
contradiction_threshold = 0
completeness_threshold = 0
clarity_threshold = 2  # allow minor clarity issues
